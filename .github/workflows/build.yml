name: Build KPM Module
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - __uses: actions/checkout@v4

      - name: Set up NDK
        __uses: ndk-actions/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Download KernelPatch SDK
        run: |
          git clone https://github.com
          echo "KPM_SDK_PATH=$GITHUB_WORKSPACE/KernelPatch/kpm/sdk" >> $GITHUB_ENV

      - name: Build Module
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          make -C $KPM_SDK_PATH M=$GITHUB_WORKSPACE modules

      - name: Upload Artifact
        __uses: actions/upload-artifact@v4
        with:
          name: realme8_zstd_pro
          path: ./*.kpm
          
